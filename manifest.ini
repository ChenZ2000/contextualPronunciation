name = "contextualPronunciation"
summary = "Context-aware pronunciation normalization"
description = """Corrects selected Chinese polyphones and preserves lexical apostrophes before text reaches the active speech synthesizer."""
author = "ChenZ2000 and contributors"
url = "https://github.com/ChenZ2000/contextualPronunciation"
version = "0.7.4"
changelog = """First public repository release: add community documentation, reproducible GitHub builds, release checksums and Add-on Store submission metadata. Preserve the 0.7.3 pronunciation engine."""
docFileName = "readme.html"
minimumNVDAVersion = "2026.2"
lastTestedNVDAVersion = "2026.2"

[symbolDictionaries]
	[[lexicalApostrophe]]
		displayName = "Preserve apostrophes inside words"
		mandatory = true

[brailleTables]
	[[zhcn-contextual-2018.ctb]]
		displayName = "Chinese common braille 2018 - contextual phrases (experimental)"
		contracted = false
		input = false
		output = true
