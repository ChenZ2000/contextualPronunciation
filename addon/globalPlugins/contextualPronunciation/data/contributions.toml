[[rules]]
id = "yue-music-prefix"
pattern = "{musicPrefix}[乐:yuè]"
source = "CC-CEDICT music headwords; 仙乐 also MOE https://dict.concised.moe.edu.tw/dictView.jsp?ID=27272&la=0&powerMode=0"
