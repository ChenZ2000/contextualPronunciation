negative = ["乐观", "快乐", "乐高", "可口可乐"]

[[rules]]
id = "yue-music-form"
pattern = "[乐:yuè]{musicForm}"
source = "CC-CEDICT 乐曲 yue4 qu3, 乐谱 yue4 pu3, 乐章 yue4 zhang1, 乐器 yue4 qi4, 乐队 yue4 dui4, 乐团 yue4 tuan2"
