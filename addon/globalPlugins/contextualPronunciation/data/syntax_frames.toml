# Local argument grammar, not a list of complete sentences. Project-authored.
# OpenHowNet supplies POS/semantic classes, not pronunciations. Readings here are
# reviewed against CC-CEDICT/KFCD and the existing contribution sense evidence.
schemaVersion = 1

[[frames]]
id = "syntax-growth"
target = "长"
reading = "zhang3"
object = "growthPredicate"
prefixes = [""]
source = "MOE 長 zhang3 生長/發育 https://dict.revised.moe.edu.tw/dictView.jsp?ID=7910 ; pinned CC-CEDICT 长大/长出/长得/长脸 zhang3 lian3 (honor), 长个子 stature; body-site location, growing subject and actual product head attach locally."
positive = ["身上长", "背上长了", "胸前长了", "我的脸上又长了两个痘痘", "孩子长高了", "树长出新叶", "他长得很高", "给我长脸了", "长脸了", "长个子了", "个子长了", "各自长了"]
negative = ["头发很长", "这条绳子长三米", "长江大桥", "身上长裙很好看", "痘痘的照片长三米", "背上，长"]

