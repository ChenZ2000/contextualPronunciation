name: Temporary contextual meng 0.8.0 validation
on:
  push:
    branches: [maintenance/meng-context-080-validation-20260928]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Recover exact candidate and pinned public integration inputs
        shell: bash
        run: |
          mkdir -p /tmp/meng080-recovery
          cp .github/workflows/meng080-validation.yml /tmp/meng080-recovery/recovery-workflow.yml
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          data = base64.b64decode(''.join(Path(f'.github/meng080/part{i}.b64').read_text() for i in range(5)), validate=True)
          assert hashlib.sha256(data).hexdigest() == '7e521d1090ee6de1e4fd02bf5f55746e58c00e9190d8935ee64554377a1b152d'
          Path('/tmp/meng080-recovery/original.patch').write_bytes(lzma.decompress(data))
          PY
          git fetch --depth=1 origin ba7c0c1160b7c79d7d9917d3749bc465be113ecc
          git checkout --detach ba7c0c1160b7c79d7d9917d3749bc465be113ecc
          git apply --unidiff-zero /tmp/meng080-recovery/original.patch
          uv tool run --from ruff==0.15.9 ruff format addon tests tools scripts buildVars.py
          uv tool run --from ruff==0.15.9 ruff check --fix addon tests tools scripts buildVars.py
          uv tool run --from ruff==0.15.9 ruff format addon tests tools scripts buildVars.py
          python scripts/prepare_nvda.py
          python scripts/prepare_worldvoice.py
          python scripts/prepare_cpp.py
          uv run --no-project --with markdown==3.10.2 python tools/build_user_help.py
          python tools/build_polyphone_coverage.py
          python tools/build_braille_table.py
          git add -u
          git add addon/globalPlugins/contextualPronunciation/colloquial_meng.py tests/meng_cases.py tests/test_meng_contexts.py tools/evaluate_colloquial_meng.py tools/benchmark_colloquial_meng.py docs/COLLOQUIAL_MENG.md docs/releases/0.8.0.md
          git diff --cached --binary > /tmp/meng080-recovery/formatted.patch
          git -c user.name=Validation -c user.email=validation@example.invalid commit -m 'Local recovery snapshot only'
          git archive --format=zip --output=/tmp/meng080-recovery/candidate-source.zip HEAD
          tar --exclude=.git --exclude=__pycache__ -czf /tmp/meng080-recovery/public-test-sources.tar.gz vendor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meng080-recovery
          path: /tmp/meng080-recovery/*
          retention-days: 7
