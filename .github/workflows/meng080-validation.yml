name: Temporary contextual meng 0.8.0 validation
on:
  push:
    branches: [maintenance/meng-context-080-validation-20260928]
permissions:
  contents: write
  actions: read
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ba7c0c1160b7c79d7d9917d3749bc465be113ecc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.13'
      - name: Restore and verify the exact candidate already passing 341 tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10958073987/zip" > /tmp/meng080-verified.zip
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          raw = Path('/tmp/meng080-verified.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '2ef10f4a8b9e34ddac827c1965d46ac31d83ffd42e07542423b47ba007673d40'
          with zipfile.ZipFile('/tmp/meng080-verified.zip') as archive:
              for name in archive.namelist():
                  path = Path(name)
                  assert path.parts[0] == 'artifacts' and not path.is_absolute() and '..' not in path.parts
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(name))
          patch = Path('artifacts/meng080-candidate-input.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '9321918749e88af3d120bc42f3ee656d28cc43215710676516371493f1c39004'
          PY
          git apply artifacts/meng080-candidate-input.patch
          test ! -e .github/meng080
          test ! -e .github/workflows/meng080-validation.yml
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          data = json.loads(Path('artifacts/addon-tests.json').read_text())
          assert data['passed'] and data['testsRun'] == 341
          assert data['failures'] == data['errors'] == data['skipped'] == 0
          for name, digest in data['sourceSha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          evidence = {'testsFromRun': 36395820377, 'testsRun': 341, 'sourceHashesVerified': len(data['sourceSha256']), 'passed': True, 'artifactSha256': '2ef10f4a8b9e34ddac827c1965d46ac31d83ffd42e07542423b47ba007673d40'}
          Path('artifacts/meng080-recovered-tests.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          # Keep absolute workstation observations rather than mislabeling them
          # as hosted failures; production CI uses the unchanged paired policy.
          from scripts.evidence import validate_performance, validate_grammar_performance
          observations = []
          for name, validator in [('performance-report.json', validate_performance), ('grammar-performance.json', validate_grammar_performance)]:
              try:
                  validator(json.loads(Path('artifacts', name).read_text()))
              except ValueError as error:
                  observations.append(str(error))
          Path('artifacts/meng080-absolute-observations.json').write_text(json.dumps(observations, indent=2) + '\n')
          print('Retained absolute workstation observations:', observations)
          PY
      - name: Recheck colloquial correctness and unchanged dedicated latency budgets
        shell: bash
        run: |
          python tools/evaluate_colloquial_meng.py | tee artifacts/meng080-context-evaluation.log
          python tools/benchmark_colloquial_meng.py | tee artifacts/meng080-context-performance.log
      - name: Enforce original same-runner immutable-baseline policy
        shell: bash
        run: python scripts/compare_hosted_performance.py | tee artifacts/meng080-hosted-comparison.log
      - name: Audit and build reproducible 0.8.0 assets without publishing
        shell: bash
        run: |
          python scripts/check_repository.py
          python scripts/build_public_release.py --tag v0.8.0 | tee artifacts/meng080-release-build.log
          git diff --check
      - name: Commit validated source on temporary candidate branch only
        shell: bash
        run: |
          test ! -e .github/meng080
          test ! -e .github/workflows/meng080-validation.yml
          git config user.name 'ChenZ'
          git config user.email 'mail@chenz.cloud'
          git add -u
          git add addon/globalPlugins/contextualPronunciation/colloquial_meng.py tests/meng_cases.py tests/test_meng_contexts.py tools/evaluate_colloquial_meng.py tools/benchmark_colloquial_meng.py docs/COLLOQUIAL_MENG.md docs/releases/0.8.0.md
          git diff --cached --check
          git commit -m 'fix: restrict colloquial meng to positive grammatical contexts; prepare 0.8.0'
          test "$(git rev-parse HEAD^)" = ba7c0c1160b7c79d7d9917d3749bc465be113ecc
          git push origin HEAD:refs/heads/maintenance/meng-context-080-candidate-20260928
          git show --stat --oneline HEAD > artifacts/meng080-candidate.txt
          git diff HEAD^ HEAD --binary > artifacts/meng080-fix.patch
          git archive --format=zip --output=artifacts/meng080-fixed-source.zip HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: meng080-validation
          path: |
            artifacts/meng080-*
            artifacts/addon-tests.json
            artifacts/colloquial-meng-*.json
            artifacts/cpp-evaluation.json
            artifacts/grammar-evaluation.json
            artifacts/performance-report.json
            artifacts/grammar-performance.json
            artifacts/hosted-performance-comparison.json
            artifacts/baseline-performance.json
            artifacts/baseline-grammar-performance.json
            artifacts/paired-current-performance.json
            artifacts/paired-current-grammar-performance.json
            artifacts/hosted-performance-samples/*.json
            artifacts/hosted-baseline-benchmark.log
            dist/*
          retention-days: 14
