name: Publish release from main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.13'
          architecture: x64
      - name: Require both native CI targets for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/require_release_ci.py --repository "$env:GH_REPO"
      - name: Read version and build reproducible release files
        run: python scripts/build_public_release.py
      - name: Get pinned official Store validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvaccess/addon-datastore
          ref: e716e9c6878c54036150052fb2372c4630d743ee
          path: vendor/addon-datastore
          persist-credentials: false
          sparse-checkout: |
            validation
            transform
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.32'
          enable-cache: false
      - name: Install locked Store validation dependencies
        run: uv sync --project vendor/addon-datastore --frozen --no-default-groups
      - name: Validate package with official manifest, schema and API checks
        run: vendor/addon-datastore/.venv/Scripts/python.exe scripts/check_store_metadata.py --validator-root vendor/addon-datastore
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath dist/release-metadata.json -Raw | ConvertFrom-Json
          $existingTag = & git ls-remote --tags origin "refs/tags/$($metadata.tag)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing release tags' }
          if ($existingTag) { throw 'Version tag already exists; update the version on main before publishing' }
          $assets = @($metadata.packages | ForEach-Object { Join-Path dist $_.name })
          $assets += @('dist/SHA256SUMS', 'dist/release-metadata.json', 'dist/ci-verification.json', 'dist/store-submission.md')
          $releaseArgs = @('release', 'create', $metadata.tag, '--target', $env:RELEASE_COMMIT,
            '--title', "Context-aware Pronunciation $($metadata.version)",
            '--notes-file', "docs/releases/$($metadata.version).md")
          if ($metadata.channel -ne 'stable') { $releaseArgs += '--prerelease' }
          & gh @releaseArgs @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing versions are never overwritten' }
      - name: Show Store submission fields
        shell: pwsh
        run: |
          'Use the official [Add-on Store registration form](https://github.com/nvaccess/addon-datastore/issues/new?template=registerAddon.yml) with these fields. Store submission and approval are separate from this release.' >> $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath dist/store-submission.md >> $env:GITHUB_STEP_SUMMARY
