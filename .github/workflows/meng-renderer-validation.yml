name: Temporary meng renderer validation
on:
  push:
    branches: [maintenance/meng-renderer-validation-20260928]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d29ec969a43985ef25865e679287f097468e71b1
          persist-credentials: false
      - name: Export exact baseline and inspect available Mandarin renderer
        shell: bash
        run: |
          mkdir -p /tmp/meng-evidence
          git archive --format=zip --output=/tmp/meng-evidence/source-main.zip HEAD
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          texts = ["懵", "蒙", "矇", "擝", "掹", "一脸蒙逼", "一脸矇逼", "一脸擝逼", "一脸掹逼", "一脸蒙", "一脸矇", "蒙了", "矇了", "蒙圈", "矇圈", "meng1", "meng2", "meng3"]
          report = {"version": subprocess.check_output(["espeak-ng", "--version"], text=True), "voice": "cmn", "cases": []}
          for text in texts:
              p = subprocess.run(["espeak-ng", "-v", "cmn", "-q", "-x", text], capture_output=True, text=True, check=True)
              report["cases"].append({"text": text, "phonemes": p.stdout.strip()})
          Path("/tmp/meng-evidence/espeak-probe.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meng-renderer-baseline
          path: /tmp/meng-evidence/*
          retention-days: 7
